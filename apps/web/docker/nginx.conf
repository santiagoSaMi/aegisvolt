# nginx de la consola: sin privilegios, logs JSON (ADR-0028) en stdout/stderr.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  # Directorios temporales escribibles (el sistema de archivos puede ser de solo lectura).
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $status $log_level {
    ~^5 error;
    ~^4 warn;
    default info;
  }

  # Una línea JSON por petición con los campos de ADR-0028 (sin query string ni cabeceras).
  log_format aegisvolt escape=json
    '{"timestamp":"$time_iso8601","level":"$log_level","service_name":"web",'
    '"environment":"$aegisvolt_env","correlation_id":"$http_x_correlation_id",'
    '"operation":"$request_method $uri","event":"http_request","http_status":$status,'
    '"duration_ms":$request_time,"message":"Petición HTTP"}';
  access_log /dev/stdout aegisvolt;

  include /etc/nginx/conf.d/*.conf;
}
