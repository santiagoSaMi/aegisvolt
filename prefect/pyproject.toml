[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisvolt-observability"
version = "0.1.0"
description = "Flows de Prefect para observar y auditar AegisVolt (solo lectura, por las APIs de cada servicio)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Versiones exactas, publicadas hace más de 14 días (ADR-0030).
dependencies = [
  "prefect==3.9.1",
  "boto3==1.43.118",
  # boto3 admite cualquier botocore 1.43.x: se fija para respetar la antigüedad mínima.
  "botocore==1.43.118",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
  "mypy==2.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aegisvolt_observability"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore.*"]
ignore_missing_imports = true
