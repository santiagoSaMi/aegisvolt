apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Argo Rollouts v1.10.1 (ADR-0032). vendor/install.yaml lo descarga y verifica
# scripts/k8s/vendor-platform.sh (sha256 fijado).
namespace: argo-rollouts
resources:
  - namespace.yaml
  - vendor/install.yaml
images:
  - name: quay.io/argoproj/argo-rollouts
    newTag: v1.10.1@sha256:fbcc4cf0a29da25d86230992b1dfdeadf30b6f1baa74ea7c9c98e3e580769396
patches:
  # Región para el proveedor de métricas CloudWatch (AWS real: IRSA para credenciales).
  - target:
      kind: Deployment
      name: argo-rollouts
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: AWS_REGION
            value: us-east-1
