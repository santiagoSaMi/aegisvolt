apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# SOLO entorno local (Floci). En AWS real no se incluye.
resources:
  - service-floci.yaml
configMapGenerator:
  # Sustituye la salida de CloudWatch por la de Floci (endpoint, puerto y sin TLS).
  - name: fluent-bit-config
    namespace: logging
    behavior: merge
    files:
      - outputs.yaml
secretGenerator:
  # Credenciales FICTICIAS del emulador (CLAUDE.md). Nunca credenciales reales.
  - name: floci-aws
    namespace: logging
    literals:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
patches:
  - target:
      kind: DaemonSet
      name: fluent-bit
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - secretRef:
              name: floci-aws
      # CA local de Floci (se genera en cada instalación; no está en el repositorio).
      # La crea el script de despliegue local desde infra/local/floci/data/tls/.
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: floci-ca
          configMap:
            name: floci-ca
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: floci-ca
          mountPath: /fluent-bit/floci-ca
          readOnly: true
