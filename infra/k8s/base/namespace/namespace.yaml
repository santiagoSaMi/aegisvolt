apiVersion: v1
kind: Namespace
metadata:
  name: aegisvolt
  labels:
    app.kubernetes.io/part-of: aegisvolt
    # Pod Security Admission: las apps cumplen el perfil restricted (no root, sin
    # capacidades, seccomp RuntimeDefault, sin escalada de privilegios).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
