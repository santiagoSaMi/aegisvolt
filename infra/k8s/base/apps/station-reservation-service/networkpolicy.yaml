# station-reservation-service: tráfico permitido además de DNS y AWS (políticas comunes del namespace).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: station-reservation-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: station-reservation-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: graphql-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: saga-orchestrator-service
      ports:
        - port: 8080
          protocol: TCP
