# Identidad propia por unidad. Sin token de la API de Kubernetes (no la usa).
# AWS real: anotación de IRSA/Pod Identity con un rol de mínimo privilegio (fase de IaC).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: station-reservation-service
  labels:
    app.kubernetes.io/name: station-reservation-service
    app.kubernetes.io/part-of: aegisvolt
    app.kubernetes.io/component: service
automountServiceAccountToken: false
