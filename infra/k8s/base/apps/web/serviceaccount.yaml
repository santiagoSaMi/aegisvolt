# Identidad propia por unidad. Sin token de la API de Kubernetes (no la usa).
# AWS real: anotación de IRSA/Pod Identity con un rol de mínimo privilegio (fase de IaC).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: aegisvolt
    app.kubernetes.io/component: frontend
automountServiceAccountToken: false
