# Salida a CloudWatch Logs (AWS real). El componente `floci` reemplaza este archivo.
# - Grupo: /aegisvolt/<env>/<app.kubernetes.io/name> (lo crea Terraform: auto_create_group off).
#   Si falta la etiqueta, se usa el grupo de respaldo /aegisvolt/<env>/unclassified.
# - Stream: un log stream por pod.
# - log_key log: se envía la línea original de la app (JSON de ADR-0028), sin metadatos.
pipeline:
  outputs:
    - name: cloudwatch_logs
      match: kube.*
      region: ${AWS_REGION}
      log_group_name: /aegisvolt/${AEGISVOLT_ENV}/unclassified
      log_group_template: /aegisvolt/${AEGISVOLT_ENV}/$kubernetes['labels']['app.kubernetes.io/name']
      log_stream_prefix: unnamed-
      log_stream_template: $kubernetes['pod_name']
      log_key: log
      auto_create_group: false
      retry_limit: 5
      workers: 1
