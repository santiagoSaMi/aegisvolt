apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Recolección de logs hacia CloudWatch (ADR-0029).
resources:
  - namespace.yaml
  - rbac.yaml
  - daemonset.yaml
configMapGenerator:
  - name: fluent-bit-config
    namespace: logging
    files:
      - fluent-bit.yaml
      - outputs.yaml
