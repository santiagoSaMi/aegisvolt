apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: aegisvolt-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
        app.kubernetes.io/part-of: aegisvolt-platform
    spec:
      serviceAccountName: fluent-bit
      # Security context del POD (KSV-0118): seccomp por defecto del runtime para todo el pod.
      # El contenedor añade el suyo (root solo para leer /var/log del nodo, sin capacidades).
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Un colector en cada nodo, también en los que tienen taints.
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          # Fluent Bit 5.1.5 (2026-10-20), fijado por digest (ADR-0029).
          image: fluent/fluent-bit:5.1.5@sha256:2740f387f6e68fab66d28e4fa6a853387b9cab6ffb4cb78958f69bba4eb0e7b4
          args: ['-c', '/fluent-bit/etc/fluent-bit.yaml']
          env:
            - name: AWS_REGION
              value: us-east-1
            # Ambiente del clúster: lo fija el overlay (un clúster por ambiente, ADR-0012).
            - name: AEGISVOLT_ENV
              value: unset
          ports:
            - name: http
              containerPort: 2020
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            # Root solo para LEER /var/log del nodo (archivos 0640 de root); sin
            # capacidades, sin escalar privilegios y con el sistema de archivos de solo lectura.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/fluent-bit/state
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        # Posición de lectura (tail.db) y búfer en disco: sobreviven al reinicio del pod.
        - name: state
          hostPath:
            path: /var/fluent-bit/state
            type: DirectoryOrCreate
