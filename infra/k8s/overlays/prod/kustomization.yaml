apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Clúster prod (un clúster por ambiente, ADR-0012). Las imágenes las fija el
# despliegue por commit (scripts/floci/k8s-deploy.sh: kustomize images sha-<commit>).
resources:
  - ../../base
  - pdb.yaml
components:
  # Local: AWS = Floci (endpoint, credenciales ficticias, logs). En AWS real se quita.
  - ../../components/floci
configMapGenerator:
  - name: station-reservation-service-config
    namespace: aegisvolt
    behavior: merge
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=info
      - DYNAMODB_TABLE_NAME=aegisvolt-reservations-prod
  - name: billing-wallet-service-config
    namespace: aegisvolt
    behavior: merge
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=info
      - DYNAMODB_TABLE_NAME=aegisvolt-billing-prod
  - name: energy-dispatch-service-config
    namespace: aegisvolt
    behavior: merge
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=info
      - DYNAMODB_TABLE_NAME=aegisvolt-dispatch-prod
  - name: saga-orchestrator-service-config
    namespace: aegisvolt
    behavior: merge
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=info
      - DYNAMODB_TABLE_NAME=aegisvolt-sagas-prod
  - name: graphql-api-config
    namespace: aegisvolt
    behavior: merge
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=info
  - name: web-config
    namespace: aegisvolt
    behavior: merge
    literals:
      - APP_ENV=prod
patches:
  # Ambiente del colector de logs: /aegisvolt/prod/<servicio> (ADR-0029).
  - target:
      kind: DaemonSet
      name: fluent-bit
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: prod
  # prod: dos réplicas por unidad y más recursos (sin punto único de falla).
  - target:
      kind: Deployment
      namespace: aegisvolt
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
